<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam · projektor</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2307080b'/%3E%3Crect x='3' y='9.5' width='4.5' height='5' rx='1.2' fill='%2319f0ff'/%3E%3Cpath d='M8.5 10.6 21 5.5v13l-12.5-5.1z' fill='%23ff3df2'/%3E%3C/svg%3E">
<style>
html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
body { color: #e8ecf4; font: 600 16px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#wrap { position: fixed; inset: 0; }
#gl, #ov { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; }
#gl { object-fit: contain; }
#ov { touch-action: none; }
#hud { position: absolute; top: 3.4vh; left: 50%; display: flex; align-items: center; gap: 3.4vh; font-size: 3.4vh; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 1.4vh rgba(25, 240, 255, 0.55); pointer-events: none; opacity: 0; transform: translateX(-50%); transition: opacity 0.25s; }
#hud.on { opacity: 1; }
#hud .coin { color: #ffd23d; text-shadow: 0 0 1.4vh rgba(255, 210, 61, 0.6); }
#hud .pw { font-size: 2.4vh; }
#hud .pw.big { color: #ff8cf6; }
#hud .pw.feather { color: #c8f7ff; }
#hud .pw.star { color: #ffd23d; }
#msg { position: absolute; left: 50%; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 1.6vh; max-width: 72vw; text-align: center; pointer-events: none; opacity: 0; transform: translate(-50%, -50%); transition: opacity 0.3s; }
#msg.on { opacity: 1; }
#msg b { font-size: 6vh; text-shadow: 0 0 2.2vh rgba(25, 240, 255, 0.7); }
#msg span { color: #c3cad8; font-size: 2.6vh; font-weight: 500; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="ov"></canvas>
  <div id="hud"></div>
  <div id="msg" class="on"><b>Beam · projektor</b><span>Łączę z edytorem...</span></div>
</div>
<script>
(function () {
  var app = null, failed = null;
  function say(title, sub) {
    var m = document.getElementById('msg'), b = document.createElement('b'), s = document.createElement('span');
    b.textContent = title;
    s.textContent = sub;
    m.replaceChildren(b, s);
    m.classList.add('on');
  }
  function tick() {
    var a = null;
    try { a = window.opener && !window.opener.closed ? window.opener.beam : null; } catch (e) { a = null; }
    if (a && a.ready && a.projector && a !== failed && (a !== app || !a.projector.attached || a.projector.win !== window)) {
      app = a;
      try {
        a.projector.attach(window);
      } catch (e) {
        failed = a;
        say('Beam · projektor', 'Nie udało się połączyć: ' + (e && e.message ? e.message : e));
        console.error(e);
      }
    } else if (!a && app) {
      app = null;
      say('Beam · projektor', 'Edytor jest zamknięty. Otwórz Beam i kliknij Otwórz okno projektora.');
    } else if (!a && !window.opener) {
      say('Beam · projektor', 'Otwórz to okno z Beam: krok Projektor, przycisk Otwórz okno projektora.');
    }
  }
  setInterval(tick, 600);
  tick();
})();
</script>
</body>
</html>
