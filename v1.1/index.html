<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beam</title>
<meta name="description" content="Beam: projection mapping jako gra. Kalibrujesz ścianę, mapujesz prawdziwe rzeczy, a ludziki biegają po świetle.">
<meta name="theme-color" content="#07080b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2307080b'/%3E%3Crect x='3' y='9.5' width='4.5' height='5' rx='1.2' fill='%2319f0ff'/%3E%3Cpath d='M8.5 10.6 21 5.5v13l-12.5-5.1z' fill='%23ff3df2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@dimforge/rapier2d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.14.0/rapier.es.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<header id="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><defs><linearGradient id="beamg" x1="0" x2="1"><stop offset="0" stop-color="#19f0ff"/><stop offset="1" stop-color="#ff3df2"/></linearGradient></defs><rect x="2" y="9.5" width="5" height="5" rx="1.2" fill="#19f0ff"/><path d="M8.5 10.6 22 4.8v14.4l-13.5-5.8z" fill="url(#beamg)" opacity=".9"/></svg>
    <span>Beam</span>
  </div>
  <nav id="steps"></nav>
  <div id="topRight"></div>
</header>
<main id="main">
  <aside id="toolbar" class="off"></aside>
  <section id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="stagebar"></div>
    <div id="hud"></div>
    <div id="toast"></div>
  </section>
  <aside id="panel"></aside>
</main>
<footer id="status"><span id="hint"></span><span id="coords"></span></footer>
<div id="loading"><div class="spin"></div><p>Włączam projektor...</p></div>
<noscript><p class="nojs">Beam potrzebuje JavaScriptu.</p></noscript>
</body>
</html>
